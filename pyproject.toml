[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observability-lab"
version = "0.1.0"
description = "A hands-on study of OpenTelemetry as evidence about AI agent execution."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ptw1255 contributors" }]
dependencies = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
integration = [
  "certifi>=2024.8.30",
  "opentelemetry-exporter-otlp>=1.30,<2",
]

[project.scripts]
aol = "agent_observability_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
